services:
  lobbybot:
    build: .
    image: fortnite-lobby-bot-dashboard
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3000:3000"

    # SQLite, the encryption key, replays and media all live under /app/data.
    # Keep this volume to preserve accounts, device auth and configuration
    # across `docker compose down` / `up`.
    volumes:
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
